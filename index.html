<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Red Flags Foundation</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@500;600;700&display=swap');

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #070707;
      color: #fff;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .landing {
      width: 100%;
      max-width: 620px;
      padding: 40px 24px;
      text-align: center;
    }

    .flag {
      color: #d51b2a;
      font-size: 58px;
      line-height: 1;
      margin-bottom: 18px;
    }

    .brand {
      margin: 0;
      font: 700 48px/0.95 'Cormorant Garamond', Georgia, serif;
      letter-spacing: .02em;
    }

    .brand span {
      color: #d51b2a;
    }

    .tagline {
      margin: 12px 0 42px;
      font: 500 8px 'Montserrat', Arial, sans-serif;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: #bc8730;
    }

    .message {
      margin: 0 auto 30px;
      max-width: 480px;
      font: 500 14px/1.8 'Montserrat', Arial, sans-serif;
      color: #d5d5d5;
    }

    .email-label {
      display: block;
      margin-bottom: 9px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #bc8730;
    }

    .email {
      width: 100%;
      height: 52px;
      padding: 0 18px;
      border: 1px solid #bc873055;
      background: #0d0d0d;
      color: #fff;
      outline: none;
      font: 500 12px 'Montserrat', Arial, sans-serif;
      text-align: center;
    }

    .email::placeholder {
      color: #777;
    }

    .email:focus {
      border-color: #bc8730;
    }

    .button {
      width: 100%;
      height: 52px;
      margin-top: 12px;
      border: 1px solid #bc8730;
      background: #bc8730;
      color: #070707;
      cursor: pointer;
      font: 700 10px 'Montserrat', Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: all .2s ease;
    }

    .button:hover {
      background: #d51b2a;
      border-color: #d51b2a;
      color: #fff;
    }

    .optional {
      margin-top: 11px;
      color: #666;
      font-size: 8px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .footer {
      margin-top: 48px;
      color: #555;
      font-size: 8px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .landing {
        padding: 30px 22px;
      }

      .flag {
        font-size: 48px;
      }

      .brand {
        font-size: 38px;
      }

      .tagline {
        margin-bottom: 34px;
      }

      .message {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="landing">

    <div class="flag">⚑</div>

    <h1 class="brand">
      RED <span>FLAGS</span> FOUNDATION
    </h1>

    <div class="tagline">
      We don't ignore them. We collect them.
    </div>

    <p class="message">
      We're making moves. Enter your email if you'd like to stay connected,
      or head straight to the site.
    </p>

    <label class="email-label" for="email">
      Stay Connected <span style="color:#666;">(Optional)</span>
    </label>

    <input
      id="email"
      class="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <button class="button" id="goToSite" type="button">
      Go To Site
    </button>

    <div class="optional">
      No email required. Seriously.
    </div>

    <div class="footer">
      Red Flags Foundation
    </div>

  </main>

  <script>
    const SITE_URL =
      'https://nicegirlinla.wixsite.com/red-flags';

    document
      .getElementById('goToSite')
      .addEventListener('click', function () {

        const email =
          document.getElementById('email').value.trim();

        /*
         * EMAIL IS OPTIONAL.
         *
         * If an email was entered, you can later connect
         * this section to your email marketing provider.
         *
         * For now, everyone goes directly to the site.
         */

        window.location.href = SITE_URL;
      });
  </script>

</body>
</html>
