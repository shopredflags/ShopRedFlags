<!-- ========================================= -->
<!--   RED FLAGS & RECEIPTS — HERO SYSTEM      -->
<!--   Cinematic Editorial Banner Sections     -->
<!--   Parallax + Fade + Text Reveal           -->
<!-- ========================================= -->

<style>
  /* ============================
     BASE HERO LAYOUT
     ============================ */
  .hero {
    height: 80vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed; /* PARALLAX */
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 100px 20px;
    color: white;
    text-align: center;
    overflow: hidden;
  }

  /* ============================
     TEXT OVERLAY
     ============================ */
  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 780px;
    font-family: "Inter", sans-serif;
    opacity: 0;
    transform: translateY(40px);
    animation: heroFadeUp 1.4s ease-out forwards;
  }

  .hero-content h1 {
    font-size: 3.4rem;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .hero-content p {
    font-size: 1.3rem;
    font-weight: 400;
    opacity: 0.9;
  }

  /* ============================
     CINEMATIC OVERLAY
     ============================ */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.15),
      rgba(0,0,0,0.65)
    );
    z-index: 1;
  }

  /* ============================
     HERO IMAGES
     ============================ */
  .hero-1 {
    background-image: url("images/hero2.jpg");
  }

  .hero-2 {
    background-image: url("images/hero3.jpg");
  }

  /* ============================
     SECTION BLENDING
     ============================ */
  .hero + .hero {
    margin-top: -80px; /* cinematic overlap */
  }

  .hero-2::before {
    background: linear-gradient(
      to top,
      rgba(0,0,0,0.75),
      rgba(0,0,0,0.45),
      transparent
    );
  }

  /* ============================
     ANIMATIONS
     ============================ */
  @keyframes heroFadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ============================
     MOBILE RESPONSIVE
     ============================ */
  @media (max-width: 768px) {
    .hero {
      height: 65vh;
      padding: 70px 20px;
      background-attachment: scroll; /* disable parallax on mobile */
    }

    .hero-content h1 {
      font-size: 2.4rem;
    }

    .hero-content p {
      font-size: 1.15rem;
    }
  }
</style>

<!-- ========================= -->
<!--        HERO #1            -->
<!-- ========================= -->

<section class="hero hero-1">
  <div class="hero-content">
    <h1>Red Flags & Receipts</h1>
    <p>Where the truth gets dressed up and the lies get exposed</p>
  </div>
</section>

<!-- ========================= -->
<!--        HERO #2            -->
<!-- ========================= -->

<section class="hero hero-2">
  <div class="hero-content">
    <h1>She Raised Me Right</h1>
    <p>Stories, style, and survival — all in one place</p>
  </div>
</section>
